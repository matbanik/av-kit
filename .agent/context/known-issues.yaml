  - id: YOUTUBE-CAPTIONS-IP-BLOCK
    title: YouTube is blocking caption requests from the maintainer's IP
    severity: medium
    component: infrastructure
    status: open
    discovered: '2026-11-03'
    root_cause: 'YouTube answers the caption fetch with HTTP 429 and its ''automated queries'' Sorry page. Measured on 2026-11-04 from the maintainer''s network: listing a video''s captions succeeds and the video does have them, then the GET of www.youtube.com/api/timedtext gets 429, for an auto-captioned video (VSU9VjZFoLI) and a manually captioned one (jNQXAC9IVRw). The same refusal came from youtube-transcript-api 1.2.4 (the latest on PyPI and the version the installer ships), plain requests, browser headers, curl_cffi impersonating Chrome, Firefox and Safari, system curl over IPv4, and yt-dlp 2026.10.26 with and without impersonation. The caption URL has no pot parameter and no exp=xpe, so this is not the library''s PoTokenRequired case. Video downloads from the same network work. The evidence points away from a changed caption format or a broken library, and at a block on the caption endpoint for this network. Not established: whether other networks get the same answer, which is what separates a block on this address from a wider YouTube change, and when or why it began. IPv6 and signed-in requests were not tried. The product adapter reports it as TranscriptRetryableError ''YouTube is blocking requests from your IP''.'
    blast_radius: 'Transcript fails on this network until the block lifts, and that includes the installed app: the published v0.1.0-rc.1 on the maintainer''s test PC, which shares this network''s one public address, failed this way for two videos on 2026-11-04. That PC is not a second network and no other network has been tested, so the reach is unknown. If other networks get the same answer, Transcript is broken for every user and this needs raising. The live MCP audit reports transcript.compile as a REGRESSION against the baseline because that signature is only tolerated in container mode. Do not refresh the audit baseline to hide it.'
    resolution_path: 'Decisive check, for Mat: in the installed app, add a captioned video from a different public network, such as a phone hotspot. Real captions there mean the block is bound to this address: close this when this network recovers. The same failure there means a wider YouTube change: raise the severity, correct docs/releases/v0.1.0-rc.1.md:56-57 (which states it is your network) and the README, and reconsider the fetch path. Upstream answers IP blocks by pointing at proxies, and one reporter on its issue 613 saw a block clear after resetting their connection; neither is verified here.'
    category: UPSTREAM
    priority: P2
    related:
      - TRANSCRIPT-FAILED-NO-REASON
      - TRANSCRIPT-BLOCK-KEEPS-REQUESTING
    verification:
      last_checked: '2026-11-04'
      method: Caption list and fetch probes with each client named in root_cause (C:/Temp/av-kit/transcript-probe/)
      result: 429 Sorry page from every client, on both videos, from one public address. Other networks not tested.
    meu_links:
      - MEU-7
      - MEU-68
    notes: 'Triage 2026-11-04: Research: reported blocks are mostly cloud addresses and ''too many requests'' is a named cause; no report of a wide residential block was found; a 24-48 h reset is anecdotal (https://skipthewatch.com/blog/youtube-transcript-api-not-working, https://github.com/jdepoix/youtube-transcript-api/issues/593). The hotspot check in resolution_path stays Mat''s; raise to high and P1 if it shows the same failure.'
