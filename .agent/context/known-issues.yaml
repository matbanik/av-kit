    discovered: '2026-11-04'
    root_cause: 'tools/fetch_ffmpeg_windows.ps1 pins BtbN''s win64 GPL build autobuild-2026-10-31-12-59. BtbN''s recipe at that build (FFmpeg-Builds 5031c6f, scripts.d/50-dvd) builds libdvdcss as a static library, configures libdvdread with -Dlibdvdcss=enabled and enables all three for every GPL build of FFmpeg 7.0 or later, so the library is linked into ffmpeg.exe. The D-101 brief listed it only among the GPL-only scripts and covered copyright licences, so nobody chose to ship it. Measured on the shipped binary, sha256 c46215f8889634396f0ac0acac738ef2145175e5b6caf28b3daa8ac9a9980c5f (C:/Temp/av-kit/issue-dvd/evidence.txt): -version shows --enable-libdvdread and --enable-libdvdnav, -demuxers lists dvdvideo, and the file holds libdvdcss''s own strings, such as ''Could not open %s with libdvdcss.'' and DVDCSS_METHOD.'
