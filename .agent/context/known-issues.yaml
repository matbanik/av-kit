  - id: CAPTURE-JOURNAL-VOLATILE
    title: Interactive capture completion journal is in-memory only
    severity: low
    component: ui
    status: open
    discovered: '2026-09-01'
    root_cause: The capture completion journal that keeps a published PNG from being cancelled when POST /captures/requests/{id}/complete fails lives in main-process memory only, so an Electron restart between publication and a successful complete loses the retry.
    blast_radius: One interactive request per crash; the PNG is already in the inbox and the row expires on its own 120s TTL, so nothing is lost but the automatic completion.
    verification:
      last_checked: '2026-11-04'
    category: DEFER
    priority: P4
    related: []
    meu_links: []
  - id: E2E-ELECTRON-LAUNCH-FLAG
    title: ELECTRON_RUN_AS_NODE in the IDE terminal breaks every Electron launch - E2E and npm run dev
    severity: low
    component: ui
    status: open
    discovered: '2026-09-02'
    root_cause: 'All 14 _electron.launch() sites across ui/tests/e2e spread ...process.env into the launched app. When the invoking shell has ELECTRON_RUN_AS_NODE=1 set - which VS Code / Cursor extension-host terminals do - electron.exe starts as plain Node, rejects Chromium flags (electron.exe: bad option: --remote-debugging-port=0) and every launch dies before the window exists. Confirmed by electron --version printing v24.18.1 (the Node version) with the variable set and v42.9.3 without it. This was originally mis-filed as an Electron 42.9.3 / playwright-core 1.62.1 version incompatibility; that diagnosis is withdrawn - the suite passes 59/59 in a clean shell.'
    blast_radius: 'Only agent/developer shells that export ELECTRON_RUN_AS_NODE: the whole Playwright suite fails to start there, while CI and ordinary terminals are unaffected. The durable fix is to pass an explicit env allow-list (or delete ELECTRON_RUN_AS_NODE) at the launch helper instead of spreading process.env at 14 sites. WIDENED 2026-09-03: this is not an E2E-only fault. `npm --prefix ui run dev` is hit by the same variable with a SILENT symptom - electron-vite builds main and preload, prints "starting electron app...", and no window ever appears, with no error on any stream. That silence is why it reads as "dev does not work" rather than as an env fault. Verified 2026-09-03: scope is Process only ([Environment]::GetEnvironmentVariable(...,''User'') and (...,''Machine'') are both empty), so VS Code / Cursor inject it per terminal session; clearing it in the same shell launches the window normally (title "av-kit", renderer on 127.0.0.1:5173). WORKAROUND (both symptoms): $env:ELECTRON_RUN_AS_NODE=$null before the command, or use a terminal opened outside the IDE. Check with [Environment]::GetEnvironmentVariable(''ELECTRON_RUN_AS_NODE'',''Process'').'
    verification:
      last_checked: '2026-11-04'
    category: TECH-DEBT
    priority: P3
    related: []
    meu_links: []
    notes: 'Triage 2026-11-04: About 20 _electron.launch sites in about 19 files now, not 14, with no shared helper; ELECTRON_RUN_AS_NODE is referenced only at ui/tests/e2e/mcp-setup-prompt.test.ts:107. One launch helper also gives E2E-MAIN-PROCESS-ERRORS-UNWATCHED its home.'
  - id: TOOLING-SHARED-REGISTRY-COUPLING
    title: Framework-adoption tests depend on the shared P:/.agent registry and resolver
    severity: medium
    component: infrastructure
    status: open
    discovered: '2026-09-30'
    root_cause: tests/tooling/test_framework_adoption.py runs the live P:/.agent/tools/resolve_model.py with AGENT_MODEL_REGISTRY_HOME=P:/.agent (lines ~317-498, 800, 867). av-kit's tracked overlay .agent/model-registry.local.json pins validated_against to the global registry hash, so any edit to P:/.agent/model-registry.json made for another project (e.g. the 2026-09-29 zorivest gpt-6.1 bump) makes the resolver refuse the overlay (overlay_not_validated) and fails py-tests until the overlay is revalidated. Found by Session 26 WINDOWS_GATE attempt 6.
    blast_radius: 'Any av-kit Windows gate after a shared-registry change fails py-tests until av-kit''s overlay is revalidated; the product is unaffected. Session 26 revalidated the overlay (A17). It recurred in Session 30 (LOCAL_SEQUENCE attempt 3, registry b06d7cda… → ad9a09de…; revalidated under A-12, 2026-10-07), so severity is raised to medium. Durable fix: give these tests a fixture registry home (a snapshot of the resolver contract plus a registry) so the gate no longer depends on machine-level state, keeping one opt-in live check. RECURRED 2026-10-09 (third time): the Codex scoping-review dispatch for the 2026-10-09 grouping stopped before any provider call with overlay_not_validated (overlay records ad9a09de…, registry in use a7c95972…). Revalidating rewrites .agent/model-registry.local.json, which is in Session 30''s GATED_PATHS, so it waits for Session 30''s approval; the next av-kit WINDOWS_GATE will also fail py-tests until then.'
    verification:
      last_checked: '2026-11-04'
      method: tools/Invoke-CodexDispatch.ps1 with AGENT_MODEL_REGISTRY_HOME=P:/.agent (C:/Temp/av-kit/dispatch/scoping-run.txt)
      result: 'overlay_not_validated: overlay ad9a09defd46… vs registry a7c95972c1e8…; no provider call, no ledger round used'
    category: TECH-DEBT
    priority: P2
    related: []
    meu_links: []
    enrichment:
