  - id: TTS-ONNX-FP16-NONFINITE-AUDIO
    title: ONNX FP16 fails on some ordinary sentences with 'generated audio must be finite', and a fresh install preselects it
    severity: high
    component: infrastructure
    status: open
    discovered: '2026-11-04'
    root_cause: 'Unknown, and not length. Measured on 2026-11-04 on CPU with onnxruntime 1.31.1 through KokoroAdapter: model_fp16.onnx (163,234,740 B, sha256 prefix ba4527a874b42b21) returned no finite samples at all for some inputs, 623,400 of 623,400 on a 489-token chunk and 136,200 of 136,200 on a 95-token sentence, and did so on every run, while a 118-token sentence was fine. _as_float32_pcm (packages/infrastructure/src/avkit_infra/tts/adapter.py:148-161) correctly refuses that audio, and one bad chunk fails the whole generate call (:479, :441, :160). The FP32 and INT8 files from the same pinned revision gave no failures on the same text. An older FP16 file (163,227,585 B) failed the same two sentences but not the chunk. Other onnxruntime versions and session options have not been tried.'
    blast_radius: 'Measured in the dev venv on the files a fresh download gets. FP16 failed 11 of 140 sentence runs: af_heart 4/40, am_michael 2/40, af_bella 2/40, bf_emma 3/20. For a given voice the same sentence fails every time. A 96-word passage failed 3 of 3 and eight shorter paragraphs passed. PyTorch FP32, ONNX FP32 and ONNX INT8 had 0 of 140 and 0 of 8. Read from the code, not run on a fresh install: a fresh install preselects FP16 (defaultModelSelection, ui/src/renderer/src/features/tts/tts-controls.ts:104-117, falls back to the first row by id). FP16 did generate speech on the test PC on 2026-11-04, which fits most sentences passing. Not tried: the app''s UI, the packaged backend and another PC.'
    resolution_path: Accepted by Mat on 2026-11-04 (D-239). 1. Until the cause is known, a fresh install preselects ONNX INT8 and not FP16. Mat listens to C:/Temp/av-kit/tts-compare/listen-kokoro-onnx-int8.wav first; ONNX FP32 is the alternative. 2. Look for the cause, with the failing sentences as a fixed test set. 3. If FP16 can't be made to work, what happens to the variant comes back to Mat. Needs a new installer. Done when the preselected model generates the 40 test sentences and the 96-word passage on a packaged build with no failure, and the cause or the outcome for FP16 is recorded.
    notes: 'Timing on three sentences, 12.6 s of speech, CPU: PyTorch FP32 13.0x real time, load 3.00 s, peak 1,328 MB; ONNX FP32 8.8x, load 0.67 s, peak 817 MB; ONNX INT8 8.8x, load 0.65 s, peak 583 MB; FP16 failed 3 of 3. Speech length across the three working variants matched to within 0.1 s. Raw results: C:/Temp/av-kit/fp16-rate-probe.txt and fp16-nan-probe.txt, not durable.'
    category: MEU-NEW
    priority: P2
    meu_links:
      - MEU-62
      - MEU-72
      - MEU-121
    related:
      - TTS-PYTORCH-OFFERED-WITHOUT-RUNTIME
      - TTS-FAILED-LOAD-DROPS-MODEL
      - TTS-PYTORCH-RUNTIME-SETTINGS-DOWNLOAD
    verification:
      last_checked: '2026-11-04'
      method: 'Probe through KokoroAdapter in the dev venv with the phoneme step cached: 40 sentences on three voices, 20 on a fourth, 8 paragraphs, per variant'
      result: FP16 11 of 140 sentence runs failed; the other three variants 0 of 140
    enrichment:
      questions_asked:
        - 'D-239: Which model does a fresh install preselect while ONNX FP16 fails on some ordinary sentences?'
      answers:
        - 'D-239: INT8 or FP32 until the cause is known, per the recommendation Mat accepted on 2026-11-04'
      decided_by: human
      decision_log:
        - id: D-239
          stage: triage
          question: Which model does a fresh install preselect while ONNX FP16 fails on some ordinary sentences?
          resolution: human
          class: product-preference
          chosen: ONNX INT8 or ONNX FP32 until the cause is known. INT8 is the working choice, as the smallest file with the least memory. Mat listens to it first
          source_tag: Human-approved
          precedents:
            - ui/src/renderer/src/features/tts/tts-controls.ts:104-117 — the fallback order that lands on FP16 today
            - TTS-PYTORCH-OFFERED-WITHOUT-RUNTIME D-217 — Mat ruled the same day that PyTorch stays out of installed builds, which leaves only the ONNX variants
          research:
            engine: none
            sources: []
          reasoning: A user who keeps the preselected model should not hit a failure on an ordinary sentence. INT8 and FP32 had no failures in the 2026-11-04 probe and generated at the same speed. INT8 is 92 MB against 326 MB and peaked at 583 MB against 817 MB. Nobody has compared them by ear, so the choice between them stays with Mat's listening check.
          human_message_reference: USER_EXPLICIT 2026-11-04 'All ohter recommendations are accepted'
  - id: CLOSEOUT-CHECK-REFUSES-REGISTER
    title: The closeout check refuses known-issues.yaml as the triage tool writes it, and --decision-issue keeps only the last value
    severity: medium
    component: agent
    status: resolved
    discovered: '2026-11-04'
    root_cause: 'issue_decision_log (tools/validate_closeout_artifacts.py:1480) reads known-issues.yaml with a bounded YAML grammar that refuses list items at their key''s indent and wrapped plain scalars. model.save (tools/issue_triage/model.py:333-352) writes both shapes: PyYAML''s dump writes indentless lists and width=200 wraps long values. model.save rewrites the whole file, so a hand repair lasts only until the next save. Separately, the check''s placeholder test refuses brace and angle-bracket text inside a log, and --decision-issue (:5556) is single-value, so repeating the flag checks only the last issue.'
    blast_radius: 'Measured 2026-11-04 with C:/Temp/av-kit/s49-issue-log-scan.py: the check refuses 64 of the 66 decision logs in the working tree and 44 of 46 at HEAD. An in-memory dump with indented lists and no wrap leaves 7 refusals, all from the placeholder test: CAPTURE-FLATTEN-WITH-BACKUP, TTS-VOICE-PACK-LAZY-FETCH, MCP-TTS-GENERATE-SYNCHRONOUS, MCP-SETUP-PROMPT, QUEUE-PILL-TOKEN-DRIFT, CONVERT-EXTRACT-STREAM-INDEX-MISMATCH and UNINSTALL-LEAVES-INSTALLER-COPY (the last since reworded, D-228). Any session whose H2-2 row points the check at the register fails at the very end, after its review. Sessions 50 to 57 close issues with decision logs. Plan review doesn''t reliably catch it: the parked Session 49 plan had the same row and was approved. No product code or shipped file is affected.'
    resolution_path: 'Fixed in Session 49b on 2026-11-05 (plan 2026-11-05-closeout-register-grammar, D-274): model.save writes indented lists without wrapping (D-281), the register was reformatted once with every parsed value asserted equal, --decision-issue is repeatable (D-283), and the six remaining logs were reworded with the same meaning (D-285). Session 49''s D-272 extract is no longer needed.'
    verification:
      last_checked: '2026-11-05'
      method: Session 49's reflection check rerun against the register with --decision-issue UNINSTALL-LEAVES-INSTALLER-COPY --decision-issue FFMPEG-LIBDVDCSS-BUNDLED and no extract (plan 2026-11-05-closeout-register-grammar task row 6, receipt C:/Temp/av-kit/s49b-done-proof.txt)
      result: 'Exit 0: 28 recorded decision(s) reconciled against 28 Decisions Log row(s). Before the fix the same command exited 1 with ''is not valid YAML'' (C:/Temp/av-kit/s49b-done-proof-red.txt). The reformat changed 0 parsed fields and the reword 15, after which 67 of 67 decision logs read (s49b-reformat.txt, s49b-reword.txt).'
    category: TECH-DEBT
    priority: P3
    related:
      - CLOSEOUT-SELFTEST-ANCESTOR-AGENT-DIR
    meu_links: []
    notes: 'Triage 2026-11-04: Rediscovered at least four times and never tracked: docs/execution/reflections/2026-10-14-capture-chrome-reflection.md:49 (A-15 and Session 28''s A14), 2026-10-14-tts-engine-runtime-reflection.md:26, 2026-10-14-backend-robustness-reflection.md:120, and 2026-10-16-tts-voice-panel-reflection.md:92,98,225. Not yet in a session of the 2026-11-04 grouping.'
    enrichment:
      questions_asked:
        - 'D-279: Does the closeout check''s refusal of the issue register get tracked as an issue?'
        - 'D-274: When is the tooling fixed?'
      answers:
        - 'D-279: Yes, filed here'
        - 'D-274: Session 49b, after Session 49 and before Session 50'
      decision_log:
