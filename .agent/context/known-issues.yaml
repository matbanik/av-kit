  - id: MAIN-LOG-AFTER-WINDOW-DESTROYED
    title: Backend output after the window is destroyed stops the main process behind a JavaScript error dialog
    severity: medium
    component: ui
    status: resolved
    discovered: '2026-11-04'
    root_cause: 'onChildOutput in ui/src/main/index.ts sent each line with mainWindow?.webContents.send. mainWindow is never cleared, so ?. does not protect a destroyed window, and reading webContents from one throws TypeError: Object has been destroyed. An uncaught exception in the main process shows a modal dialog that holds the process until it is dismissed.'
    blast_radius: 'Observed: Mat dismissed four of these dialogs during H1-2 attempt 4, in E2E runs, where AVKIT_E2E lets the window close while the backend still writes. Read from the code, not reproduced by hand: an installed copy reaches it only with Close to tray off, when the X button destroys the window and the backend writes before shutdown finishes. Not measured: how often that happens, or how many earlier gate runs showed the dialog with nobody there to see it. Present since the initial commit.'
    meu_links:
      - MEU-108
    verification:
      last_checked: '2026-11-04'
      method: AC-108.5 to AC-108.7, ready-probe-guard.test.ts and the real-Electron case backend-output-after-close.test.ts, which destroys the window and pushes a line through the real onChildOutput handler
      result: Before the fix both unit cases and the real-Electron case failed with Object has been destroyed, on the stdout and stderr streams. After it they pass, with 1129 UI tests passing.
    resolution_path: Fixed under MEU-108 on 2026-11-04 (plan D-209, ECN-9). forwardConsoleLines in ui/src/main/python-manager.ts sends nothing to a destroyed window and catches a send that throws. The line stays in the in-memory log. The tray's Show window item has the same shape and is left as it is, because only a menu click during shutdown reaches it.
