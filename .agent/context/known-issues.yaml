      method: 'Session 33 MEU-76: the unhandled-exception handler logs api.unhandled_error with request_id, route and traceback and answers a 500 internal_error that carries the CORS headers (CORS_ON_500); yt-dlp extract failures on download add raise the typed ExtractError (422) whose message reaches the client; GUI_ERROR_TEXT shows the reason'
