      USER_EXPLICIT 2026-09-30 GUI walkthrough (screenshots of TTS, Capture, Console, Settings). Candidate for the next /session-grouping run; no MEU yet.

      RESOLUTION PATH (proposed): New REST action (e.g. POST /captures/{id}/flatten) that copies original_path to {backup_dir}/{stem}.{timestamp}.png, then writes the baked image over original_path, clears annotated_path + sidecar, and returns the backup path; a 'Revert' that restores from the newest backup. Settings: capture.backup_dir (default {inbox}/.backup) and capture.flatten_backup (bool, default on). UI: 'Apply to image' button next to Save with a confirm strip; MCP mirrors the action. This is the only item in this batch needing API/MCP + domain changes - plan it as its own MEU with its own OpenAPI diff.
