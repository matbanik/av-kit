  - id: TTS-GENERATE-FAILED-SILENT
    title: TTS Generate shows 'Failed' with no reason in the UI and nothing in the console
    severity: high
    component: core
    status: resolved
    discovered: '2026-09-30'
    root_cause: 'Confirmed on the target (Session 26 local triage, 2026-09-30, recorded in current-focus.md): TTS produces no audio because the spaCy `en_core_web_sm` model is not installed and the ONNX vocab path is not wired, so generation fails before any audio exists. Two gaps then make that failure invisible. (1) packages/core/src/avkit_core/services/tts.py generate() catches DomainError and returns _mark(job, Failed, str(exc)) as a normal 201 job; the module has a structlog logger (module=tts) but emits no log on that path, so the console shows only tts.load_model. (2) ui/src/renderer/src/features/tts/TTSPage.tsx renders the status chip and resolveRunBarSlot() only surfaces the client-side `error` state; the job''s error_message (typed in useTtsJob.ts, never read) is never displayed, so the run bar shows ''Failed'' + ''No output yet''. Earlier cloud hypothesis (empty FFmpeg path + MP3 -> FFmpegNotFoundError after synthesis, packages/infrastructure/src/avkit_infra/media/adapter.py:228/246) is a second, later failure on the same path, not the first one; the local triage also noted ffmpeg resolution diverges between Settings, Convert and the Downloader.'
    blast_radius: 'Every TTS generation failure is opaque to the user: no error text, no console line, and the job''s error_message is only reachable via the REST poll. With ffmpeg missing every MP3 job fails after a full synthesis pass.'
    resolution_path: ''
    notes: |-
      USER_EXPLICIT 2026-09-30 GUI walkthrough (screenshots of TTS, Capture, Console, Settings). Candidate for the next /session-grouping run; no MEU yet. Root cause confirmed locally in the Session 26 conversation; the cloud's ffmpeg hypothesis was wrong as the first cause (see .agent/docs/cloud-local-collaboration.md §7).

      RESOLUTION PATH (proposed): core: log.warning('tts.generate_failed', job_id=..., error=...) in both except branches and log.info('tts.generate' / 'tts.generate_done') around the run. ui: render job.error_message in the run bar error slot (resolveRunBarSlot should treat a Failed job with error_message as 'error'), and disable/annotate the MP3 option or show a readiness hint when FFmpeg path is empty (Settings > Dependencies already knows). Add a regression test for Failed-with-error_message rendering.
    verification:
      evidence_file: docs/execution/plans/2026-09-30-tts-repair/tts-live-result.json
      last_checked: '2026-10-01'
      method: Session 27 MEU-62 (AC-62.x); authoritative Windows TTS_LIVE
      result: 'TTS_LIVE 5/5 @ 407db19: assets missing -> ready, generate-wav Done (2.075 s WAV, RMS > 0), console has tts.generate + tts.generate_done; every Failed job carries a reason (MEU-62) that reaches the Console and the run bar (AC-63.4/63.5). WINDOWS_GATE attempt 7 @ 407db19 (pytest 629/0, Vitest 702/702, e2e 117 passed + 1 unexpected AC-49.26 accepted under A-7; windows-gate-check FAIL accepted by Mat, human-gate-decision.md A-7); execution review approved round 1'
    category: MEU-NEW
    priority: P2
    related:
      - tts-engine
      - tts-page
    meu_links:
      - MEU-62
      - MEU-63
    enrichment:
      questions_asked:
        - How should the spaCy en_core_web_sm model and the ONNX vocab file be provisioned on a user machine?
      answers:
        - Managed downloads inside the model-manager flow + Dependencies/readiness rows (D-22 recommendation)
      decided_by: human
      decision_log:
        - id: D-3
          stage: triage
          question: How is a failed generation surfaced?
          resolution: autonomous
          class: two-way
          chosen: Log tts.generate / tts.generate_failed with job_id and error in services/tts.py; render job.error_message in the run-bar error slot; regression test for Failed-with-error_message
          source_tag: Local Canon
          precedents:
            - AGENTS.md §Code Quality — structured logging, handle all errors
            - .agent/docs/emerging-standards.md G25 — status codes are not proof of behaviour
          research:
            engine: web_search
            sources: []
          reasoning: Local canon already mandates both; no fork.
        - id: D-22
          stage: triage
          question: How do the TTS engine runtime assets (ONNX config.json vocab, spaCy en_core_web_sm) get onto a user machine?
          resolution: human
          class: one-way-door
          chosen: 'Managed downloads: ONNX vocab fetched from hexgrad/Kokoro-82M with each ONNX variant and passed as KokoroAdapter(onnx_vocab_path=...) in wiring.py; spaCy en_core_web_sm fetched on first PyTorch load; both shown as Settings > Dependencies readiness rows with a Get action; nothing bundled in the installer'
          source_tag: Human-approved
          precedents:
            - packages/core/src/avkit_core/services/models.py download — single-flight user-triggered model downloads
            - docs/build-plan/06-gui.md Dependencies / readiness card
          research:
            engine: web_search
            sources:
              - https://docs.voicebox.sh/developer/model-management — runtime assets as installable states, not installer payload
          reasoning: Recommended over bundling (installer size, version pinning) and a pip extra (packaged app cannot add wheels); the vocab wiring fix in wiring.py:167 is needed under every option.
          human_message_reference: 'USER_EXPLICIT 2026-09-30 ''D-22: follow you recommendation'''
