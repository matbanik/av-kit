  - id: MCP-TTS-GENERATE-SYNCHRONOUS
    title: avkit_tts.generate blocks until synthesis ends; MCP's 30 s timeout turns longer texts into fetch_failed while the job keeps running, and a running job cannot be cancelled
    severity: high
    component: mcp-server
    status: resolved
    discovered: '2026-10-01'
    root_cause: 'POST /tts/generate (packages/api/src/avkit_api/routes/tts.py:54-69) calls TTSService.generate, which synthesizes inline (services/tts.py:113-200) and returns the job only after it is Done/Failed. The MCP server calls it with DEFAULT_TIMEOUT_MS = 30_000 (mcp-server/src/client.ts:14; only add/capture get ADD_TIMEOUT_MS), so the tool reports ''fetch_failed: fetch failed'' after 30 s for any text that takes longer, while the backend job continues. The job id is only in the response, so no client can call DELETE /tts/{id} on a running job (cancel just adds the id to _cancel_ids, services/tts.py:110-111). Reproduced 2026-10-01 in the Session 28 container audit (CPU, kokoro-onnx-int8): a 66-character text took 12,531 ms (Done, valid MP3); a ~3,600-character text returned fetch_failed at 30,005 ms.'
    blast_radius: 'Every MCP consumer using TTS: anything beyond a sentence or two on CPU fails with an opaque fetch error, yet an audio file still appears later; avkit_tts.cancel cannot stop a run; a second generate during the hidden run gets 409 ''already in progress''. The GUI is subject to the same synchronous POST (MEU-63 run bar).'
    verification:
      evidence_file: docs/execution/plans/2026-10-14-backend-robustness/mcp-audit-summary.json
      last_checked: '2026-10-16'
      method: 'Session 33 MEU-77: POST /tts/generate returns the job at once (201, Queued or Running), a background worker synthesizes it, DELETE /tts/{id} cancels a running job and removes its partial WAV and MP3, restart recovery and shutdown stop the worker; authoritative MCP audit (s33-h1-2-audit-r3) and WINDOWS_GATE'
      result: MCP audit 99/99, 70 actions pass, avkit_tts.cancel FIXED (attempt 1/3, before=false after=true), tts.generate Done 60,044 B MP3, AUDIT_FINGERPRINT 49d577f4bc8c; WINDOWS_GATE s33-h1-3-windows-gate-r2 on the final tree (17/17 stages; pytest 724/0, Vitest 804/804, Electron 139/0/0/0, MCP 423/423; GATE_FINGERPRINT 300cc234644b); execution review approved round 2 (Codex gpt-6.1-sol, 0 findings)
    category: MEU-NEW
    priority: P2
    related:
      - tts-engine
      - tts-api
      - mcp-server
    enrichment:
      questions_asked: []
      answers: []
      decided_by: agent
      decision_log:
        - id: D-44
          stage: triage
          question: How should TTS generation be exposed so long texts do not time out and can be cancelled?
          resolution: autonomous
          class: two-way
          chosen: POST /tts/generate queues the job and returns it at once (Queued/Running); synthesis runs in the background; clients poll the job and DELETE /tts/ID (ID is the job id) cancels a running job between segments; MCP generate returns the job id and the GUI run bar polls
          source_tag: Local Canon
          precedents:
            - packages/core/src/avkit_core/services/conversion.py — queued jobs with polling and cancel
            - mcp-server/src/client.ts:14 — 30 s DEFAULT_TIMEOUT_MS
          research:
            engine: none
            sources: []
          reasoning: Downloads, transcripts and conversions already follow queue-and-poll; TTS is the only inline long operation. Local API with in-repo clients only, so the contract change is two-way at ordinary cost.
