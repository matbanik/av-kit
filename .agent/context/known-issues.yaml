  - id: FFMPEG-RESOLUTION-DIVERGENCE
    title: 'FFmpeg is resolved three different ways: Settings/Convert/TTS share a startup-cached adapter, the Downloader ignores the setting, and the Dependencies path echoes the raw setting'
    severity: medium
    component: infrastructure
    status: resolved
    discovered: '2026-09-30'
    root_cause: 'Code-confirmed 2026-10-09. (1) wiring.py:160-161 reads downloader.ffmpeg_path once at startup into one FFmpegAdapter (configured -> frozen bundle -> shutil.which, adapter.py:211-223) shared by health, conversion and TTS MP3 (wiring.py:179,195,200); _probed latches the first result, including None, for the process lifetime (adapter.py:212-214). (2) The Downloader never receives it: wiring.py:144-149 builds YouTubeAdapter with no ffmpeg argument and youtube/adapter.py:335-342/423-432 never set ffmpeg_location, so yt-dlp uses bare ffmpeg on PATH only (yt_dlp/postprocessor/ffmpeg.py:105-107), ignoring the setting that lives in its own namespace and the bundled binary. (3) routes/health.py:26-33,60-63 report path = the raw current setting, not the resolved binary. (4) ffprobe is derived as a sibling of the resolved ffmpeg (adapter.py:233-235) with no PATH fallback, so health can say ready while probe fails. hypothesis (not yet observed on an installed build): in the packaged app with no ffmpeg on PATH, Settings/Convert show available via the bundle while bestvideo+bestaudio downloads (youtube/adapter.py:47-48,106) fail the merge.'
