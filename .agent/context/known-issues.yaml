  - id: TRANSCRIPT-FAILED-NO-REASON
    title: 'A failed transcript shows only ''Failed'': the reason is saved but never reaches the API, the page or the log'
    severity: high
    component: api
    status: open
    discovered: '2026-11-04'
    root_cause: 'The reason is stored per video in TranscriptItem.error_message (packages/core/src/avkit_core/services/transcript.py:477, :493) and goes no further. packages/api/src/avkit_api/routes/transcripts.py _aggregates returns only the done count, last title and last status; _job_out passes job.error_message, which this service never fills; and no route returns items. The Transcript feature in ui/src/renderer/src/features/transcript reads no error field: TranscriptPage.tsx:122 shows ''Last: <title> <status>''. services/transcript.py has no log.error or log.warning, so the Console shows nothing either, and transcript-help-content.ts:15-17 covers Requeue only. A video with no captions is silent too: the adapter returns None and the item becomes Skipped with no reason (services/transcript.py:501-503). The stored text is the library''s multi-paragraph message, which points at the library''s own README for proxies, so it needs a short av-kit wording rather than a pass-through.'
    blast_radius: 'Measured on the published RC1 on the maintainer''s test PC on 2026-11-04: a job for a public video with English captions (VSU9VjZFoLI) ended Failed after 96 s, with error_message null and last_item_status Failed from GET /transcripts, and empty raw and compiled folders. A second video failed the same way. The reason was found only by scanning the database file''s bytes. Every Transcript user is affected: they cannot tell a YouTube block from a bug or from a video with no captions. The published notes (docs/releases/v0.1.0-rc.1.md:56-57) tell users what to do ''If you see that message'', and the app never shows it. docs/releases/publish-checklist-v0.1.0-rc.1.md:171 already says the page does not show which. The gap costs more because, by design, one failed video keeps a whole channel job from compiling (docs/build-plan/03-service-layer.md:236).'
    resolution_path: 'Proposed for triage, not approved: map each failure to a short av-kit message (blocked by YouTube, so try later or on another network; no captions; video unavailable; anything else, with its reason), return it from the API, show it on the job card and log it. Give Skipped the same treatment. Done when a blocked job''s card states the reason and the Console has a matching line.'
    category: MEU-NEW
    priority: P2
    related:
      - YOUTUBE-CAPTIONS-IP-BLOCK
      - TRANSCRIPT-BLOCK-KEEPS-REQUESTING
      - CONSOLE-FAILURE-DETAIL-LOST
    verification:
      last_checked: '2026-11-04'
    meu_links:
      - MEU-11
      - MEU-16
      - MEU-21
      - MEU-115
    enrichment:
      questions_asked: []
      answers: []
      decision_log:
        - id: D-218
          stage: triage
          question: How does a failed or skipped video's reason reach the user?
          resolution: autonomous
          class: two-way
          chosen: Map each cause to a short av-kit message (blocked, no captions, unavailable, other with its reason). Return it from the API, show it on the job card and log it. Skipped gets the same treatment.
          source_tag: Local Canon
          precedents:
            - .agent/context/known-issues.yaml TTS-GENERATE-FAILED-SILENT D-3 — log the failure and render the job's error in the page's error slot
            - AGENTS.md §Code Quality — structured logging, handle all errors
          research:
            engine: none
