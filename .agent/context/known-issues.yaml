  - id: TRANSCRIPT-BLOCK-KEEPS-REQUESTING
    title: A channel job keeps requesting captions after YouTube refuses, and the Requests per hour setting does nothing
    severity: medium
    component: core
    status: open
    discovered: '2026-11-04'
    root_cause: The loop at packages/core/src/avkit_core/services/transcript.py:415-426 goes on to the next video after a failure. _fetch_item gives each blocked video up to max_retries attempts at a fixed retry_delay (:472-488), and nothing carries the block over to the next video. Separately, transcript.requests_per_hour has a Settings control (ui/src/renderer/src/features/settings/SettingsPage.tsx:740), a schema and an MCP setting, but no service reads it (git grep over packages, ui/src and mcp-server/src).
    blast_radius: 'Read from the code and calculated from the defaults, not measured: during a block, a 100-video channel makes 300 attempts over about 2.75 hours (100 x (3 x 30 s + 6 s), plus one 300 s batch pause) before ending Failed with nothing to show. Whether those requests prolong a block is not known. The default pacing does match the setting''s default (6 s apart with a 300 s pause after 50 is about 300 videos an hour), but changing the setting has no effect, so a user who lowers it to stay under a limit is not protected.'
    resolution_path: 'Proposed for triage, not approved: on a block, stop the run or hold it with a growing wait, and leave the remaining videos pending for a later retry. Either enforce requests_per_hour or remove its control.'
    category: MEU-NEW
    priority: P3
    related:
      - YOUTUBE-CAPTIONS-IP-BLOCK
      - TRANSCRIPT-FAILED-NO-REASON
    verification:
      last_checked: '2026-11-04'
    meu_links:
      - MEU-11
      - MEU-116
    enrichment:
      questions_asked: []
      answers: []
      decision_log:
        - id: D-219
          stage: triage
          question: What does a run do once YouTube blocks it?
          resolution: autonomous
          class: two-way
          chosen: 'When one video exhausts max_retries on TranscriptRetryableError, stop the run: that video and the rest stay Pending and the job goes Paused with the reason. No growing wait and no new number.'
          source_tag: Research-backed
          precedents:
            - docs/build-plan/03-service-layer.md:236 — one failed video keeps a whole channel job from compiling, so Pending keeps the job recoverable
            - 'docs/build-plan/03-service-layer.md:227 — the spec''s pause path: job.status = Paused; runtime = Paused; return'
          research:
            engine: exa
            sources:
              - https://github.com/jdepoix/youtube-transcript-api — 'Same can happen to the IP of your self-hosted solution, if you are doing too many requests'
              - 'https://transcriptapi.io/youtube-transcript-api-blocked — a block is per address: ''Not from this IP'' (proxy vendor)'
              - https://videotranscriber.ai/blog/youtube-transcript-api-not-working — 'No amount of retrying from the same server IP' (transcript vendor)
              - https://github.com/github/copilot-cli/issues/2760 — a long-wait 429 is effectively a stop signal
              - https://developer.nylas.com/docs/cookbook/use-cases/build/handle-rate-limit-errors — stop or back off on repeated rate-limit answers
          reasoning: That error only means a block (RETRYABLE_ERRORS at transcript/adapter.py:21), so the next video would meet the same answer. The Processing to Paused to Processing edge and _pause_parent already exist (domain/transcript.py:26-35, services/transcript.py:577). A growing wait loses because it adds a tuning number and keeps asking. Several sources are vendors. Two-way.
          human_message_reference: USER_EXPLICIT 2026-11-04 'All ohter recommendations are accepted' (Mat was shown this autonomous decision in the triage report and accepted it)
        - id: D-220
