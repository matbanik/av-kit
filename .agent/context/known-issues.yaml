      evidence_file: .agent/context/handoffs/2026-10-24-gui-theme-path-fields-MEU-94-handoff.md
      last_checked: '2026-10-26'
      method: 'Session 40 MEU-94: useDocumentTheme and useG30Styles re-render every G30 select and its option menu on THEME_CHANGED_EVENT (one dark-class read, one copy of the G30 pairs); boot-theme.ts applies the localStorage mirror before createRoot; THEME_GATE holds route content until the boot GET /settings/ui settles (503 retry inside 60 s, the whole load bounded by a deadline, EC-6); the Electron THEME_PROBE pins Settings, TTS and Convert in both themes and after a cold boot (AC-94.1-94.11)'
