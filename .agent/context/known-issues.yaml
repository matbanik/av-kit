  - id: TTS-PYTORCH-OFFERED-WITHOUT-RUNTIME
    title: The installed app offers the PyTorch voice model and downloads 327 MB, but can never load it
    severity: high
    component: infrastructure
    status: open
    discovered: '2026-11-04'
    root_cause: docs/build-plan/07-distribution.md:227 says to list the PyTorch variant in /models/available and fail the load with a clear ModelLoadError unless the user has a supported torch install (documented extra). No such extra is documented, and whether a frozen backend could import a user-installed torch has not been tried. The installer's backend has no torch or kokoro (its _internal folder has onnxruntime, misaki and spacy, checked on the published RC1), so _load_pytorch raises 'PyTorch runtime is not bundled' at packages/infrastructure/src/avkit_infra/tts/adapter.py:294. That text gives no next step, and tts-help-content.ts, the README and the release notes never mention PyTorch.
    blast_radius: 'Measured on the published v0.1.0-rc.1 on the maintainer''s test PC on 2026-11-04: kokoro-v1_0.pth downloaded at 327,212,226 B and the app logged six failed loads; the two lines that show a model name kokoro-pt-fp32. ONNX FP16 then downloaded, loaded and generated speech on the same machine, so TTS itself works. Read from the code, not run on a fresh install: a fresh install preselects ONNX FP16 (defaultModelSelection, ui/src/renderer/src/features/tts/tts-controls.ts:108, takes the first downloaded row, else the first row by id), so reaching the dead end takes a user choosing PyTorch, after which it is preselected if it is the only download. MCP reads the same /models/available. The app cannot remove the file afterwards: packages/api/src/avkit_api/routes/models.py has no delete route.'
    resolution_path: Ruled by Mat on 2026-11-04 (D-217). A build that can't run PyTorch lists the variant disabled with a reason and refuses the model download with a 409, so it cannot start a download it cannot use. Word the reason with a next step, such as choosing an ONNX model. Availability comes from whether the runtime imports, so npm run dev, which has torch in the repo's .venv, keeps working. Correct docs/build-plan/07-distribution.md:30 and :227, which name an optional extra that was never built. No runtime download (TTS-PYTORCH-RUNTIME-SETTINGS-DOWNLOAD is closed) and no delete route. Needs a new installer. Done when an installed build cannot start the download of a model it cannot load, and the dev venv still loads and generates with it.
    category: MEU-NEW
    priority: P2
    related:
      - TTS-FAILED-LOAD-DROPS-MODEL
      - MODELS-DIR-DOCS-AND-PROBE-MISMATCH
      - TTS-PACKAGED-RUNTIME-EXCLUDED
      - TTS-MODEL-FLOW-GAPS
      - TTS-PYTORCH-RUNTIME-SETTINGS-DOWNLOAD
      - TTS-ONNX-FP16-NONFINITE-AUDIO
    verification:
      last_checked: '2026-11-04'
    meu_links:
      - MEU-72
      - MEU-117
    enrichment:
      questions_asked:
        - 'D-217: What does a build that cannot run PyTorch do with the PyTorch model?'
      answers:
        - 'D-217: disabled with a reason and a 409 on download, with no runtime download'
      decision_log:
        - id: D-217
          stage: triage
          question: What does a build that cannot run PyTorch do with the PyTorch model?
          resolution: human
          class: product-preference
          chosen: List it disabled with a reason in any build that can't run it, refuse its download with a 409, and correct 07-distribution.md:30 and :227. No runtime download and no bundled torch. npm run dev keeps working
          source_tag: Human-approved
          precedents:
            - 'docs/execution/plans/2026-10-14-tts-engine-runtime/implementation-plan.md:29 — D-70, Mat approved: JA/ZH voices stay listed but unavailable with a reason, shown disabled, generate is a 409 before any job row'
          research:
            engine: exa
            sources:
              - https://www.nngroup.com/articles/drop-down-menus/ — 'Gray out any unavailable options … explaining why'
              - https://www.smashingmagazine.com/2024/05/hidden-vs-disabled-ux/ — 'Will a given user ever be able to interact? No → Hide', which favours the alternative here
          reasoning: 'Mat chose this on 2026-11-04 after asking what PyTorch adds over the three ONNX variants: the same Kokoro-82M model, about 1.5x on this PC''s CPU, and no PyTorch-only feature. Mat''s word was ''remove'', and ''as you originally suggested'' points at the first brief''s recommendation, recorded here. The first brief argued against dropping the row, and nothing deletes the code path, so dev still runs it. Disabled with a reason follows the tts-engine-runtime D-70 pattern and leaves an explanation beside a file RC1 testers already hold, since the app cannot delete it. This reverses D-236.'
          human_message_reference: USER_EXPLICIT 2026-11-04 'OK we will go with pythorch remove as you originally suggested'
      decided_by: human
  - id: TTS-FAILED-LOAD-DROPS-MODEL
    title: A failed model load unloads the model that was working
    severity: medium
    component: infrastructure
    status: open
    discovered: '2026-11-04'
    root_cause: load_model calls self.unload_model() first (packages/infrastructure/src/avkit_infra/tts/adapter.py:251), before it checks the weight path, the device or the runtime. Any load that fails after that leaves nothing loaded.
    blast_radius: 'Read from the code, and consistent with one observation: on the maintainer''s test PC on 2026-11-04, ONNX FP16 was loaded and generated speech, a later load failed, and /models/status read unloaded. The events in between were not traced, so this is not a controlled reproduction. A user who tries another model and fails is left with nothing loaded, and has to notice and reload the one that worked.'
    resolution_path: 'Proposed for triage, not approved: run the checks that do not need the old model gone (weight path, device, runtime) and unload only after they pass. Loading the new model before dropping the old one may not fit in GPU memory, so that part needs a decision. Test: load A, fail a load of B, and status still shows A.'
    category: MEU-NEW
    priority: P3
    related:
      - TTS-PYTORCH-OFFERED-WITHOUT-RUNTIME
      - TTS-GENERATE-FAILED-SILENT
    verification:
      last_checked: '2026-11-04'
    meu_links:
      - MEU-62
      - MEU-98
      - MEU-119
    enrichment:
      questions_asked: []
      answers: []
      decision_log:
        - id: D-221
          stage: triage
          question: How does a failed load keep the current model?
          resolution: autonomous
          class: two-way
          chosen: 'Check weight path, device and runtime before unload_model. No load-before-unload. Test: load A, fail a load of B, status still shows A.'
          source_tag: Local Canon
          precedents:
            - packages/infrastructure/src/avkit_infra/tts/adapter.py:251 — unload runs first today
          research:
            engine: none
            sources: []
          reasoning: The packaged build is CPU ONNX, so the GPU-memory question in the issue does not arise there. A failure after those checks can still drop the model, and the plan must state that limit. Two-way.
      decided_by: agent
