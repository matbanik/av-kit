  - id: MCP-TOOLS-LIST-EMPTY-INPUT-SCHEMA
    title: tools/list advertises an empty inputSchema for all 8 compound tools, so IDE clients see no parameters (not even action)
    severity: high
    component: mcp-server
    status: resolved
    discovered: '2026-10-01'
    root_cause: 'registerMcpSurface (mcp-server/src/toolsets/registry.ts:340-354) passes inputSchema: SCHEMAS[name], a Zod union per tool. SDK 1.30.0 McpServer tools/list (node_modules/@modelcontextprotocol/sdk/dist/esm/server/mcp.js:76-83) calls normalizeObjectSchema, which returns undefined for a non-object schema, so it emits EMPTY_OBJECT_JSON_SCHEMA. Reproduced 2026-10-01 in the container with the SDK Client over stdio against mcp-server/dist/index.js: every tool lists {type:object, properties:{}}; _meta.action_descriptions still carries 67 actions. Calls still validate server-side against the union (validateToolInput falls back to the raw schema), so a correct call works and a wrong one is refused with ''Input validation error''. Existing tests miss it because they read the private _registeredTools or call handleTool in-process (action-index.test.ts:32-35).'
    blast_radius: 'Every MCP consumer (Claude Code, Cursor, Codex via copyMcpConfig). The model sees no argument schema for any avkit_* tool and must guess action names and fields from the description text; clients that build forms or validate from inputSchema offer nothing. M1 (emerging-standards) intent unmet at the wire level. Session 30 FLATTEN_LOOK attempt 2 F8e (2026-10-03, bb61014, Claude Code VS Code extension 2.1.285 (anthropic.claude-code; CLI 2.1.280), project .mcp.json): this blocks every destructive capture action from Claude Code. avkit_capture {action: revert, id, confirm: true} was refused with "Input validation error: Invalid arguments for tool avkit_capture: Invalid input" before any elicitation prompt: no IDE prompt and no file change. tools/list probed over stdio the same day still returns {type:object, properties:{}}. With no schema the client can''t type confirm as a boolean, so the call most likely sends the string "true", which fails z.literal(true) (capture.ts:157). Calls with only string fields (capture action list, health action liveness) succeed. Decline/Accept for USER_CONFIRM therefore cannot be tested in Claude Code until this is fixed.'
