      method: Session 30 A-9 ADVERTISED_SCHEMA (tools/list advertises each tool's JSON Schema; the registered strict union still validates), AC-67.34; authoritative /mcp-audit and FLATTEN_LOOK F8 in Claude Code
      result: Authoritative /mcp-audit @ 306b07e 98/99 (only fail the filed tts.cancel); FLATTEN_LOOK F8 pass on 81fdda7 (Claude Code sees the schema and reaches the USER_CONFIRM prompt); execution review approved round 2
