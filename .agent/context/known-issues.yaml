  - id: CAPTURE-FLATTEN-WITH-BACKUP
    title: 'Capture: no way to permanently apply (flatten) annotations to the image with an automatic backup'
    severity: medium
    component: core
    status: resolved
    discovered: '2026-09-30'
    root_cause: packages/core/src/avkit_core/services/capture.py annotate_and_save() always writes a separate {stem}.annotated.png (ANNOTATED_SUFFIX) plus a {stem}.annotations.json sidecar and never touches original_path; GET /captures/{id}/image?variant=original|annotated serves whichever exists. There is no 'flatten into the original' operation, no backup folder, and no setting for either; the Capture Settings disclosure (useCaptureSettings.ts) has no such leaf.
    blast_radius: Users who want the annotated file to BE the screenshot (share/upload the original path) must find the .annotated.png sibling by hand; MCP get/annotate expose the same split.
    resolution_path: ''
