  - id: CONVERT-EXTRACT-STREAM-INDEX-MISMATCH
    title: 'Audio extract reads its stream index two ways: AAC from a normal video comes out as .mka, and All audio streams targets the wrong tracks'
    severity: medium
    component: core
    status: open
    discovered: '2026-11-04'
    root_cause: 'packages/infrastructure/src/avkit_infra/media/adapter.py:634-635 passes -map a:{stream_index}, which counts audio tracks only. packages/core/src/avkit_core/services/conversion.py treats the same number as ffprobe''s index across all streams (adapter.py:452): _output_ext compares it with stream.index at :386, and the All audio streams plan returns stream.index at :328. So First audio stream, on a video whose stream 0 is the picture, looks up the picture''s codec, finds nothing in EXTRACT_CONTAINER_MAP and falls back to .mka. docs/build-plan/08-video-conversion.md:176,178 asks for map a:0 with the container from the codec table, AAC to .m4a.'
    blast_radius: 'Measured on the published v0.1.0-rc.1 on the maintainer''s test PC on 2026-11-04: a First audio stream extract from a local .mp4 finished Done and wrote a .mka whose header names one track, A_AAC, and no picture. So the audio is right and the extension is not. Measured with the shipped FFmpeg n8.1.3-27-g8dca1586f4-20261031 on a generated .mp4 with one audio track: -map a:0 exits 0, and -map a:1 exits 127 with ''matches no streams''. Read from the code, not run in the app: All audio streams asks for a:1 on that file, so it should fail; on a file with two audio tracks after the picture it asks for a:1 and a:2, which would skip the first track and fail the second job. The cause of the .mka is also read from the code, since the job''s probe output was not saved.'
    resolution_path: 'Proposed for triage, not approved: give stream_index one meaning. Audio-relative matches the adapter and the spec''s map a:0. Then look the codec up by audio position in _output_ext, send audio positions from the All audio streams plan, and test both modes against a real .mp4, because the current tests stop at the command line or the request. Needs a new build.'
    category: MEU-NEW
    priority: P3
    related:
      - CONVERT-EXTRACT-ENCODER-LABEL
    verification:
      last_checked: '2026-11-04'
    meu_links:
      - MEU-29
      - MEU-30
      - MEU-123
    enrichment:
      questions_asked: []
      answers: []
      decision_log:
        - id: D-227
          stage: triage
          question: What does stream_index mean?
          resolution: autonomous
          class: two-way
          chosen: Audio-relative everywhere. _output_ext looks the codec up by audio position and the All audio streams plan sends audio positions. Both modes are tested against a real .mp4.
          source_tag: Local Canon
          precedents:
            - docs/build-plan/08-video-conversion.md:176,178 — map a:0 with the container from the codec table
            - 'packages/infrastructure/src/avkit_infra/media/adapter.py:634-635 — the stream specifier a: followed by the stream index'
            - packages/core/src/avkit_core/services/conversion.py:328,386 — the conflicting use
          research:
            engine: none
            sources: []
          reasoning: The adapter and the spec already mean this (-map a:N), so only the service moves. The filer measured -map a:1 failing on a one-track file. Two-way.
      decided_by: agent
