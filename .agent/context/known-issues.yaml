  - id: TTS-PYTORCH-RUNTIME-SETTINGS-DOWNLOAD
    title: Nothing downloads the PyTorch runtime, so the PyTorch model can't run in an installed app, and Settings has no row for it
    severity: medium
    component: infrastructure
    status: dismissed
    discovered: '2026-11-04'
    root_cause: 'The model Download button fetches one file: HF_FILE_MAP maps kokoro-pt-fp32 to kokoro-v1_0.pth (packages/infrastructure/src/avkit_infra/tts/voices.py:93), and packages/infrastructure/src/avkit_infra/model_manager/manager.py:83-87 downloads only that. torch and kokoro are Python packages, not model files, and the installer leaves them out on purpose (packaging/avkit-backend.spec:55-63). docs/build-plan/07-distribution.md:30 and :227 name an optional extra for them, which was never built or documented. Settings > Dependencies already downloads the vocab, the spaCy model and the voice packs with a Get action (ui/src/renderer/src/features/settings/SettingsPage.tsx:1155-1171, ui/src/renderer/src/features/tts/tts-assets.ts:9), and has no row for this runtime. Dev hides the gap: npm run dev runs from the repo''s .venv, which has torch 2.14.1 and kokoro 0.9.4 (ui/src/main/python-manager.ts:9).'
    blast_radius: 'Measured from uv.lock on 2026-11-04 for Windows and Python 3.12. kokoro needs 95 packages with the misaki[en] extras, 216 MB of wheels. 38 of them are not in the local packaged backend: 162 MB of wheels, of which torch is 124.1 MB and transformers 13.0 MB. espeakng-loader would add 9.4 MB. 162 MB is an estimate, not a minimum: nobody has worked out what KModel needs, and a package the backend bundles can still lack submodules torch expects. Unpacked in the dev venv, torch is 498 MB and transformers 56 MB. The runtime would sit outside the installer, so the 500 MB target (07-distribution.md:14,33) and the packaged absence checks (:319) still hold. The PyPI Windows wheel is a CPU build (dev reports torch.cuda False), so this gives CPU PyTorch only. Nothing is blocked: ONNX FP16 generated speech on the test PC, and the catalog has ONNX FP32 at the same size as PyTorch.'
    resolution_path: 'Closed, not built. Mat ruled on 2026-11-04 to keep PyTorch out of installed builds (D-217, which reverses D-236), so nothing downloads this runtime. If it comes back, these were the proposed steps, none tried: 1. Spike first: can the packaged backend import torch from a folder outside the bundle and load kokoro-v1_0.pth? Nobody has tried it. PyInstaller searches sys.path after its own archive, but a native extension can still fail with ''DLL load failed''; torch adds its own lib folder itself (.venv torch/__init__.py:263). 2. Follow the spaCy pattern (packages/infrastructure/src/avkit_infra/tts/assets.py:346-368, D-22): pinned wheels with the sha256 values from uv.lock, no pip, unpacked under the models directory and appended to sys.path. The set is tied to the backend''s Python (cp312) and numpy. 3. Add the runtime as a Settings > Dependencies row with Get and Remove. packages/api/src/avkit_api/routes/models.py has no delete route, and this is several hundred MB on disk. 4. Starting the PyTorch model download from the TTS page also fetches the runtime, so a download can''t end in a load that cannot work. 5. packages/infrastructure/src/avkit_infra/tts/adapter.py:25-29 reads torch once at import, so the load has to look again after the download or ask for a restart. 6. Update 07-distribution.md:30 and :227, tts-help-content.ts, the README and packaging/THIRD_PARTY_NOTICES.md. D-237 sets what happens with espeak. The misaki[ja] and [zh] extras for Japanese and Chinese voices (docs/build-plan/03-service-layer.md:447) are not covered unless Mat adds them. Needs a new installer. Done when an installed build on a machine with no dev venv downloads the runtime from Settings, loads the PyTorch model, generates speech, and can remove the runtime.'
    notes: 'Import trap, tested 2026-11-04 in the dev venv with phonemizer, espeakng_loader and misaki.espeak blocked. adapter.py:299 runs ''from kokoro import KModel'', which runs kokoro/__init__.py:23, kokoro/pipeline.py:5 and misaki/espeak.py:1,3,4, so the import fails with ImportError and the app would report ''PyTorch runtime is not bundled''. The comment at adapter.py:298 says KPipeline is never imported, but the package init imports it. Importing kokoro.model through a bare parent package worked with espeak still blocked, and KModel loaded kokoro-v1_0.pth: 81,810,022 parameters in 4.4 s. That test covered loading only. It generated no speech and did not run in a packaged backend. Why it closed: on 2026-11-04 PyTorch gave about 1.5x CPU speed over ONNX (13.0x against 8.8x real time) with the same model, for about 162 MB more to download, 600 MB on disk, a slower load and more memory. The download would have been CPU only, so it would not have delivered GPU speed. GPU speed is not filed anywhere; nobody has asked for it.'
    category: CLOSE
    meu_links:
      - MEU-62
      - MEU-72
      - MEU-73
    related:
      - TTS-PYTORCH-OFFERED-WITHOUT-RUNTIME
      - TTS-NON-ENGLISH-G2P-DEPS
      - TTS-GENERATE-FAILED-SILENT
      - TTS-PACKAGED-RUNTIME-EXCLUDED
      - TTS-ONNX-FP16-NONFINITE-AUDIO
    verification:
