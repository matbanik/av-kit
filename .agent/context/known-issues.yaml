    blast_radius: 'MCP and GUI users get ''Internal server error'' with no reason for any unmapped failure (download add being the common one); support needs the request_id and there is no log line to find. The same class as TTS-GENERATE-FAILED-SILENT (MEU-62). WIDENED 2026-10-09: the unhandled 500 also lacks Access-Control-Allow-Origin (Starlette routes the Exception handler through ServerErrorMiddleware, outside CORSMiddleware; probe with Starlette 1.6.0), so the GUI shows ''Failed to fetch'' with no status or body (TTS-MODEL-FLOW-GAPS).'
    verification:
