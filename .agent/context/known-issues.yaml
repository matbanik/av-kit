  - id: TTS-CLEANUP-APPLY-MISSING
    title: TTS Cleanup has Preview but no 'Apply cleanup' to replace the main text with the cleaned result
    severity: medium
    component: ui
    status: resolved
    discovered: '2026-09-30'
    root_cause: TTSPage.tsx only calls POST /tts/prepare from the preview-cleanup-btn handler and stores the result in previewCleaned state; nothing writes result.cleaned_text back to `text` / the input_text setting. The pipeline is still applied server-side at generate time (services/tts.py runs self._prepare.prepare(text, enabled_steps)), so the user cannot see or edit the exact text that will be spoken.
    blast_radius: TTS page. Users who want to hand-fix the cleaned text (e.g. a mis-expanded number) have no path other than retyping.
    resolution_path: ''
    notes: |-
      USER_EXPLICIT 2026-09-30 GUI walkthrough (screenshots of TTS, Capture, Console, Settings). Candidate for the next /session-grouping run; no MEU yet.

      RESOLUTION PATH (proposed): Add an 'Apply cleanup' button next to Preview that sets text = cleaned_text (marks input_text touched, persists via the existing debounced settings leaf) and clears the preview. Since generate re-runs the same steps, either keep it idempotent (the prepare steps already are for already-clean text) or add a 'cleanup already applied' hint. No API change: /tts/prepare is sufficient.
    verification:
      evidence_file: docs/execution/plans/2026-09-30-tts-repair/windows-gate-result.json
      last_checked: '2026-10-01'
      method: Session 27 MEU-64 (AC-64.x); authoritative Windows gate
      result: Cleanup Apply writes the prepared text back to the editor; AC-64.x specs pass. WINDOWS_GATE attempt 7 @ 407db19 (pytest 629/0, Vitest 702/702, e2e 117 passed + 1 unexpected AC-49.26 accepted under A-7; windows-gate-check FAIL accepted by Mat, human-gate-decision.md A-7); execution review approved round 1
