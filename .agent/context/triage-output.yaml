  title: Settings MCP setup is a hidden env-only clipboard copy; needs a viewable, universal IDE/TUI setup prompt
  severity: medium
  component: ui
  status: open
  category: MEU-NEW
  priority: P3
  enrichment:
    questions_asked: []
    answers: []
    decided_by: human
    decision_log:
    - id: D-46
      stage: triage
      question: Replace the hidden env-only copy with a viewable setup prompt?
      resolution: human
      class: product-preference
      chosen: 'Yes: a prompt shown in Settings that follows Claude Code practice and that other agents can apply to other IDE/TUI clients'
      source_tag: Human-approved
      precedents: []
      research:
        engine: none
        sources: []
      reasoning: The user stated the requirement; no fork remains.
      human_message_reference: 'USER_EXPLICIT 2026-10-03 FLATTEN_LOOK F8, relayed by the local agent (known-issues root_cause: ''a prompt shown in Settings that follows Claude Code best practice and that
        other agents can apply to other IDE and TUI platforms'')'
    - id: D-47
      stage: triage
      question: Shape of the prompt
      resolution: autonomous
      class: two-way
      chosen: Settings MCP card shows the prompt with the server command/path and per-client placement (project .mcp.json mcpServers for Claude Code/Cursor/Claude Desktop/Windsurf; .vscode/mcp.json servers+type
        stdio for VS Code) using ${AVKIT_API_TOKEN} expansion; the real token is injected only by the main process on Copy and never enters the renderer
      source_tag: Local Canon
      precedents:
      - ui/src/main/ipc.ts copy-mcp-config — token stays out of the renderer
      - known-issues MCP-SETUP-PROMPT root_cause — Claude Code docs research 2026-10-03 (.mcp.json scope, mcpServers vs servers shapes, ${VAR} expansion)
      research:
        engine: none
        sources: []
      reasoning: Research in the issue converges on project .mcp.json + ${VAR}; keeping the token in main preserves the existing security boundary. Two-way.
    - id: D-48
      stage: triage
      question: Which config scope does the setup prompt write by default?
      resolution: human
      class: source-conflict
      chosen: User scope by default (claude mcp add --scope user, and each other client's global config); a project .mcp.json block is offered as a 'this repo only' option. Supersedes the project-scope
        part of D-47.
      source_tag: Human-approved
      precedents:
      - known-issues MCP-SETUP-PROMPT root_cause — F8 failure was a local-scope entry keyed to 'P:/av-kit' read as 'p:/av-kit'
      - ~/.claude.json probe 2026-10-16 (C:/Temp/av-kit/mcp71-hdp/l1-claude-json-scopes.txt) — separate 'p:/av-kit' and 'P:/av-kit' project keys; the VS Code extension session loaded serena, zorivest and
        pomera, which exist only in top-level mcpServers
      - p:/zorivest MEU-747 / synthesis Band A — chose user scope
      research:
        engine: tavily
        sources:
        - https://code.claude.com/docs/en/mcp-quickstart — use --scope user for a server that is not tied to a project
        - https://github.com/anthropics/claude-code/issues/18122 — drive-letter case creates duplicate project keys, so MCP servers do not load
        - https://github.com/anthropics/claude-code/issues/46586 — the VS Code extension and the CLI disagree on drive-letter case
      reasoning: av-kit is a desktop tool, not a repo artifact. User scope cannot hit the path-case bug, and a committed .mcp.json would carry machine-specific absolute paths. The root_cause (a) claim that
        the extension ignores user scope did not reproduce (local probe). Local scope reproduces F8. Accepted cost - av-kit tools load in every project.
      human_message_reference: USER_EXPLICIT 2026-10-16 'accept all'
    - id: D-49
      stage: triage
      question: Does any setup-prompt block carry the token or a ${AVKIT_API_TOKEN} expansion?
      resolution: autonomous
      class: two-way
      chosen: No token in any block; the server reads {app_data}/mcp-token.txt itself; AVKIT_APP_DATA is emitted only when not the default; a regex test with a fixture token. The existing Copy MCP config
        and Pin buttons are unchanged. Supersedes the ${VAR}/inject-on-Copy part of D-47 for the prompt only.
      source_tag: Research-backed
      precedents:
      - mcp-server/src/config.ts:162-170 — the token falls back to mcp-token.txt when the env var is unset
      - docs/build-plan/06-gui.md:112 — the renderer never receives the token
      - p5 reflection RULE-1 — public MCP text redacts every token source
      - docs/build-plan/05-mcp-server.md:298 — the audit runner consumes copyMcpConfig env, so the button stays
      research:
        engine: tavily
        sources:
        - https://www.gmicloud.ai/en/blog/mcp-server-security-why-api-keys-in-config-files-are-a-liability — plaintext keys in config files are readable by agents
        - https://scalar.com/learn/mcp/mcp-server-configuration — read credentials from the environment; never commit literals
        - p:/zorivest AC-747.7 / A-11 — tokens never pass through chat
      reasoning: A file the server already reads beats both a literal token and ${VAR} expansion (which still needs the user to set an env var). Two-way.
    - id: D-50
      stage: triage
      question: What command does the prompt emit to start the MCP server?
      resolution: human
      class: product-preference
      chosen: The app's own executable (process.execPath) with ELECTRON_RUN_AS_NODE=1 in env and the server path in args, in dev and packaged modes; MEU-71 also fixes the mcp-server/src/index.ts:31-34 entry
        guard. The brief's clause 'MEU-72 keeps the dependency fix' was void when accepted (MEU-72 closed 2026-10-16 with that fix out of scope, 2026-10-14-tts-engine-runtime implementation-plan.md:418);
        the owner of packaged dependency presence is grouping D-56 (open).
      source_tag: Human-approved
      precedents:
      - known-issues MCP-PACKAGED-ENTRY-UNREACHABLE — Session 32 MCP_ENTRY_PROBE unreachable (ERR_MODULE_NOT_FOUND)
      - p:/zorivest L-5 / A-13 — app executable + ELECTRON_RUN_AS_NODE; no npx or bare node
      research:
        engine: tavily
        sources:
        - https://github.com/wanderingstan/vibeconf-app/issues/27 — bare node in a packaged app's MCP config fails silently on machines without Node; fixed with process.execPath + ELECTRON_RUN_AS_NODE,
          verified under a minimal PATH
        - https://github.com/modelcontextprotocol/mcpb/issues/89 — Claude Desktop extensions bundle their runtime; system Node cannot be assumed
        - https://forum.cursor.com/t/mcp-stdio-command-with-spaces-in-path-broken-on-windows-cmd-splits-at-space-same-mcp-json-works-in-vs-code/160842 — keep the path in args, not in command
      reasoning: One code path, no system Node, a Windows-proven precedent. ui/ configures no Electron fuses, so RunAsNode is on by default; a test pins it.
      human_message_reference: USER_EXPLICIT 2026-10-16 'accept all'
    - id: D-51
      stage: triage
      question: Which clients get blocks, in what shape?
      resolution: autonomous
      class: two-way
      chosen: Claude Code, Codex (~/.codex/config.toml [mcp_servers.avkit]), Cursor, VS Code (servers + type stdio), Claude Desktop (with the MSIX path note), Windsurf (labelled community), generic last;
        absolute command, server path in args.
      source_tag: Research-backed
      precedents:
      - p:/zorivest/docs/build-plan/05n-agent-connect.md:708 — AC-747.1 harness selector with golden tests
      - p:/zorivest synthesis A-9, A-5 — per-client shapes, MSIX-virtualized Claude Desktop path
      research:
        engine: tavily
        sources:
        - https://www.nxcode.io/resources/news/cursor-mcp-servers-complete-guide-2026 — ~/.cursor/mcp.json global, .cursor/mcp.json project
        - https://forum.cursor.com/t/mcp-stdio-command-with-spaces-in-path-broken-on-windows-cmd-splits-at-space-same-mcp-json-works-in-vs-code/160842 — empty args splits command on spaces on Windows
      reasoning: Shapes are documented facts; sources and zorivest canon agree. Two-way.
    - id: D-52
      stage: triage
      question: How does the prompt prove the connection?
      resolution: autonomous
      class: two-way
      chosen: 'The agent calls avkit_health, reports api_base and app_data, and ends with exactly one ''RESULT: connected <api_base>'' or ''RESULT: failed (<step>, <error>)'' line; no new instance_id.'
      source_tag: Local Canon
      precedents:
      - p:/zorivest AC-747.4/.6, A-6 — done means a diagnose against the intended instance
      research:
        engine: none
        sources: []
      reasoning: avkit_health already exists; an instance_id would be new API surface with no av-kit need (one instance per app_data). Two-way.
    - id: D-53
      stage: triage
      question: Write safety and restart wording
      resolution: autonomous
      class: two-way
      chosen: Back up to <file>.avkit-backup-<UTC> and merge, never overwrite; conditional restart line ('If the tools do not appear, quit and reopen <client>, then reply Ready').
      source_tag: Local Canon
      precedents:
      - p:/zorivest AC-747.2/.3, A-10, A-12 — backup-and-merge, client-specific conditional restart
      research:
        engine: none
        sources: []
      reasoning: Directly portable; nothing av-kit-specific differs. Two-way.
    - id: D-54
      stage: triage
      question: Where does the prompt live in the UI?
      resolution: autonomous
      class: two-way
      chosen: Settings MCP card gets a client selector, a read-only prompt viewer and Copy prompt; copy-mcp-btn and pin-mcp-btn move under an Advanced disclosure with testids and gui-actions-index rows
        unchanged.
      source_tag: Local Canon
      precedents:
      - ui/src/renderer/src/features/settings/SettingsPage.tsx:1091-1105 — current MCP card
      - docs/build-plan/11-page-layout.md:329 — ST row 35 testids
      - docs/build-plan/gui-actions-index.md:92-93 — settings:copy_mcp, settings:pin_mcp
      research:
        engine: none
        sources: []
      reasoning: Keeps the D-46 viewable-prompt ruling and existing testids (regression baseline, as in AC-747.10). Two-way.
    - id: D-57
      stage: plan-review
      question: Does the prompt omit AVKIT_APP_DATA when it is the default (amends D-49)?
      resolution: autonomous
      class: two-way
      chosen: No. Every block emits the app's resolved AVKIT_APP_DATA (not a secret). The rest of D-49 (no token in any block) stands.
      source_tag: Local Canon
      precedents:
      - ui/src/main/index.ts:150-151 — the app falls back to LOCALAPPDATA ?? <home>/AppData/Local, then av-kit
      - mcp-server/src/config.ts:36-42 — the server uses LOCALAPPDATA only when non-blank, else ~/.avkit
      - Codex gpt-6-astra review 2026-10-16 F1 (C:/Temp/av-kit/dispatch/mcp71-decisions-r1/final.json, not ledger-recorded) — reproduced the divergence when LOCALAPPDATA is absent
      research:
        engine: none
        sources: []
      reasoning: The two defaults diverge when a client launches the server without LOCALAPPDATA, so omission could point the server at a different descriptor and token. Emitting the path removes the dependency
        on client env; aligning the two resolvers would also work but leaves the prompt fragile to future drift. D-49's original reasoning is kept above.
    - id: D-58
      stage: plan-review
      question: Which health call proves the connection, and what does the RESULT line carry (amends D-52)?
      resolution: autonomous
      class: two-way
      chosen: 'avkit_health action=dependencies must return successfully (it needs the token; any dependency availability values count). liveness alone never yields connected. The prompt ends with exactly
        one ''RESULT: connected'' or ''RESULT: failed (<step>, <error>)'' line, where <error> is the server''s error code (for example token_missing, app_not_running). No api_base/app_data reporting: no
        health response carries them.'
      source_tag: Local Canon
      precedents:
      - packages/api/src/avkit_api/routes/health.py:27-39 — /health is unauthenticated; /health/dependencies requires the bearer token
      - mcp-server/src/toolsets/health.ts:6 — liveness needs no token; dependencies need a token
      - packages/api/src/avkit_api/schemas/health.py:12-54 — neither response has api_base or app_data
      - Codex gpt-6-astra review 2026-10-16 F2 (same receipt) — liveness ok while dependencies returns token_missing
      research:
        engine: none
        sources: []
      reasoning: Only an authenticated call proves the configured entry can use the tools; reporting fields no response carries would invite the agent to invent them. D-52's original reasoning is kept above.
