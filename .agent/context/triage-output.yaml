      reasoning: Spec forbids torch in the 500 MB budget and promises ONNX with bundled onnxruntime (07:225); kokoro-onnx shows Kokoro ONNX runs without torch. Bundling torch was the only alternative and
        it breaks the size budget. Two-way at code level.
