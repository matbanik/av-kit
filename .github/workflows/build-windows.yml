name: Windows build

# Proves a clean machine can build the installer. Manual or on a version tag; everyday
# builds stay local.
#
# FFmpeg is left out and nothing is uploaded. Its licence posture is undecided (D-101) and
# its pinned URL is gone (FFMPEG-PIN-URL-404), so this installer can't convert media and is
# not for anyone to run. tests/unit/test_ci_workflows.py keeps uploads out until that ruling.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            mcp-server/package-lock.json
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Install Python dependencies
        run: uv sync --locked --all-packages
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --ignore-scripts
      - name: Install MCP server dependencies
        working-directory: mcp-server
        run: npm ci --ignore-scripts
      - name: Package the backend
        run: uv run --locked --no-sync python tools/package_backend.py
      - name: Check the packaged backend's layout
        run: >-
          uv run --locked --no-sync pytest -q --tb=short
          "tests/unit/test_packaging_backend.py::test_pack_dist_onedir_layout[AC-24.10]"
      - name: Build the UI, picker and MCP bundle
        working-directory: ui
        run: npm run dist:prep
      - name: Build the installer
        working-directory: ui
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Report the installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem ui/dist -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "expected one installer, found $($installers.Count)" }
          $installer = $installers[0]
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash
          $megabytes = [math]::Round($installer.Length / 1MB, 1)
          "$($installer.Name): $megabytes MB, SHA-256 $sha256" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
