[project]
name = "avkit-api"
version = "0.1.0rc1"
description = "av-kit FastAPI REST surface"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "avkit-core",
    "avkit-infra",
    "fastapi>=0.115",
    "pydantic>=2",
    "httpx",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avkit_api"]

[tool.uv.sources]
avkit-core = { workspace = true }
avkit-infra = { workspace = true }
