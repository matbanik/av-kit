[project]
name = "avkit-core"
version = "0.1.0"
description = "av-kit hexagonal domain package"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "structlog>=24.0",
    "spacy>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avkit_core"]
