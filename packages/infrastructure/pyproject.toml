[project]
name = "avkit-infra"
version = "0.1.0rc2"
description = "av-kit hexagonal infrastructure adapters"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "avkit-core",
    "sqlalchemy>=2.0",
    "structlog",
    "yt-dlp",
    "youtube-transcript-api>=1.0",
    "kokoro",
    "misaki[en]==0.9.4",
    "num2words==0.5.14",
    "huggingface_hub",
    "onnxruntime>=1.16",
    "pillow>=10.0",
    "mss>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avkit_infra"]

[tool.uv.sources]
avkit-core = { workspace = true }
