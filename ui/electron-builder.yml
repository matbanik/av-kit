appId: com.avkit.app
productName: av-kit
# The author (focalia.ai) is the Publisher; the licence holder keeps the copyright.
copyright: Copyright © 2026 Mat Banik
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # The default name has spaces, and GitHub rewrites those in a release asset's name.
  artifactName: ${productName}-Setup-${version}.${ext}
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
extraResources:
  # app-icon.ts reads process.resourcesPath/icon.{png,ico} when packaged: `build/`
  # lives outside the asar, so without these entries the tray falls back to an
  # empty image and the window icon path resolves to nothing.
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
  - from: ../packaging/dist/avkit-backend
    to: avkit-backend
  - from: ../packaging/ffmpeg-win64
    to: ffmpeg
    filter:
      - "!*.zip"
  # Licences of the shipped Python components and FFmpeg (MEU-72 NOTICES).
  - from: ../packaging/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # Generated from the real build by tools/generate_third_party_licenses.py (MEU-110).
  - from: ../packaging/dist/THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt
  - from: ../LICENSE
    to: LICENSE
  - from: ../mcp-server/bundle
    to: mcp-server
  - from: ../native/region-picker/publish
    to: region-picker
